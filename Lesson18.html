<!DOCTYPE html>
<html>
  <head>
    <title>Animations - 01</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="../js/livecode.js"></script>
  </head>
  <body>
    <a-scene>
	<a-entity 
	id="Head"
	position="0 2.2 -3"
		animation="property: rotation; from : 0 -20 0; to: 0 20 0; dur: 5000; easing: linear; loop: true; dir: alternate"	
	>
	<a-box
		id="Head"
		width="1.5" height="1" depth="1.5"
		color="#edbd93"
	  >
	</a-box>
	
	  <a-box
		id="Hat"
		position="0 0.5 0"
		width="1.6" height="0.2" depth="1.6"
		color="black"
	  >
	  </a-box>
	  
	  <a-box
		id="Hat-1"
		position="0 0.9 0"
		width="1.25" height="0.5" depth="0.5"
		color="black"
	  >
	  </a-box>
	
	  <a-box
		id="REye"
		position="-0.357 0.152 0.65"
		width="0.3" height="0.3" depth="0.3"
		color="black"
	  >
	  </a-box>
	  
	  <a-box
		id="LEye"
		position="0.357 0.152 0.65"
		width="0.3" height="0.3" depth="0.3"
		color="black"
	  >
	  </a-box>
	  
	  <a-box
		id="Mouth"
		position="0 -0.268 0.65"
		width="0.35" height="0.2" depth="0.3"
		color="black"
	  >
	  </a-box>
	</a-entity>
	
	  <a-box
	  id="Neck"
	  position="0 2 -3"
	  width="0.8" height="1" depth="0.8"
	  color="#edbd93"
	  >
	  </a-box>
	
	  <a-box
	  id="Body"
	  position="0 1 -3"
	  width="1.2" height="1.2" depth="1.2"
	  color="#4578f7"
	  >
	  </a-box>
	  
	  <a-box
	  id="Lleg"
	  position="-0.3 0.2 -3"
	  width="0.5" height="1.2" depth="0.5"
	  color="black"
	  >
	  </a-box>
	  
	  <a-box
	  id="Rleg"
	  position="0.3 0.2 -3"
	  width="0.5" height="1.2" depth="0.5"
	  color="black"
	  >
	  </a-box>
	  
	  <a-box
	  id="Lhand"
	  position="0.82 1 -3"
	  width="0.4" height="0.9" depth="0.5"
	  color="#edbd93"
	  >
	  </a-box>
	 
	  <a-entity
	  id="Rhand" position="-0.82 1.45 -3"
	  animation="property: rotation; from : 10 0 0; to: -60 0 0; dur: 1000; easing: linear; loop: true; dir: alternate"	
	  >
	  
	  <a-box
	  position="0 -0.45 0"
	  width="0.4" height="0.9" depth="0.5"
	  color="#edbd93"
	  >
	  </a-box>
	  
	  <a-box
	  position="0 -0.7 0.75"
	  width="0.1" height="0.2" depth="1.5"
	  color="red"
	  >
	  </a-box>
	  
	  <a-box
	  position="0 -0.7 0.5"
	  width="0.25" height="0.5" depth="0.1"
	  color="black"
	  >
	  </a-box>
	  
	 </a-entity>
	 
    </a-scene>

</html>
