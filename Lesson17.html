<!DOCTYPE html>
<html>
  <head>
    <title>Animations - 01</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="../js/livecode.js"></script>
  </head>
  <body>
    <a-scene background="color:lightblue">
      <a-box
        position="0 1.6 -2"
        animation="property: rotation; to: 0 360 0; dur: 3000; loop: true; startEvents: mouseenter"
		color="pink"
      >
      </a-box>
	  
	  <a-box
        position="0 -0.5 -2"
        animation="property: rotation; to: 0 -360 0; dur: 3000; loop: true; startEvents: click"
		color="green"
      >
      </a-box>
	  
	   <a-box
        position="0 -2.5 -2"
        animation="property: scale; from: 1 1 1; to: 1 2 1; dur: 1000; loop: true; startEvents: click; easing: linear; dir: alternate"
		color="blue"
      >
      </a-box>
	  
	  <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
    </a-scene>
  </body>
</html>
