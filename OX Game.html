<!DOCTYPE html>
<html>
  <head>
    <title>Animations - 01</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
    <script src="//cdn.rawgit.com/donmccurdy/aframe-extras/v4.0.2/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.0.x/dist/aframe-particle-system-component.min.js"></script>
    <script src="https://unpkg.com/aframe-proxy-event-component/dist/aframe-proxy-event-component.min.js"></script>

    <script src="../js/livecode.js"></script>
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse">
      <a-sky color="lightblue"></a-sky>
      <a-entity position="0.1 0.2 -0.5" scale="0.5 0.5 0.5">
        <a-plane

            height="1"
            depth="1"
            color="red"
            animation__red="property: rotation; to: 0 90 0; startEvents: b-11"
            animation__blue="property: rotation; to: 0 -90 0; startEvents: b-12"
            animation__reset="property: rotation; to: 0 0 0; startEvents: rs"
          >

          <a-box
            id="b-2"
            position="0 3.5 -5"
            width="1"
            height="1"
            depth="1"
            color="blue"

            animation__blue="property: rotation; to: 0 -90 0; startEvents: b-22"

            height="1"
            depth="1"
            color="blue"

          <a-box

        <a-entity position="0 2 1" rotation="-60 0 0">

              id="b-11"
              position="-0.25 0 0"
              width="0.5"
              height="1"
              depth="1"
              color="blue"
              proxy-event="event: click; to: #b-1; as: b-11"

            <a-box
              id="b-12"
              position="0.25 0 0"

              height="1"

              depth="1"

            <a-box

            <a-box
              id="b-91"
              position="-0.25 0 0"
              width="0.5"
              height="1"
              depth="1"

            <a-box

        <a-box
          id="reset-1"
          position="-2.816 -0.357 -4.492"
          width="0.5"
          height="0.5"
          depth="0.5"
          color="orange"
          proxy-event__1="event: click; to: #b-1; as: rs"
          proxy-event__2="event: click; to: #b-2; as: rs"
          proxy-event__3="event: click; to: #b-3; as: rs"

      <a-entity id="NPC" position="-2 0 -3" rotation="0 30 0">
        <a-entity
          id="Head"
          position="0 2.2 -3"
          animation="property: rotation; from : 0 -20 0; to: 0 20 0; dur: 5000; easing: linear; loop: true; dir: alternate"
        >
          <a-box id="Head" width="1.5" height="1" depth="1.5" color="#edbd93">
          </a-box>

          <a-box
            id="Hat"
            position="0 0.5 0"
            width="1.6"
            height="0.2"
            depth="1.6"
            color="black"

            id="Hat-1"

            height="0.5"
            depth="0.5"

          width="1.2"
          height="1.2"
          depth="1.2"
          color="#4578f7"

        </a-box>

        <a-box
          id="Lleg"
          position="-0.3 0.2 -3"
          width="0.5"
          height="1.2"
          depth="0.5"
          color="black"

        <a-box

          width="0.4"

          depth="0.5"
          color="#edbd93"

        <a-entity
          id="Rhand"
          position="-0.82 1.45 -3"
