<!DOCTYPE html>
<html>
  <head>
    <title>Primitives - 01 - Position</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="../js/livecode.js"></script>
  </head>
  <body>
    <a-scene>
      
      <a-box
        id="box1"
        position="0 2 -2"
        
        width="1"
        height="1"
        depth="1"
             
        rotation="0 0 0"
        color="red"
      ></a-box>

      <a-box
        id="box2"
        position="1 2 -2"
        
        width="1"
        height="1"
        depth="1"
             
        rotation="0 0 0"
        color="yellow"
      ></a-box>
	  
	  <a-box
        id="box3"
        position="2 2 -2"
        
        width="1"
        height="1"
        depth="1"
             
        rotation="0 0 0"
        color="green"
      ></a-box>
      
      <a-sky color="#ECECEC"></a-sky>
      
    </a-scene>
  </body>
</html>
