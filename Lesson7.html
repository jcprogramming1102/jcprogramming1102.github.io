<!DOCTYPE html>
<html>
  <head>
    <title>360º VR - 01 - Sphere</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="../js/livecode.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img
          id="classroom"
          crossorigin="anonymous"
          src="https://cdn.glitch.me/f0fb812d-f1c0-4e81-b5a3-6c83d212a271%2FIMG_20211127_091811_00_013.jpg?v=1637979964517"
        />
      </a-assets>

      <a-box
        position="-0.4 0.800 -1.950"
        scale="0.25 0.25 0.25"
        rotation="0 30 0"
        src="#bricks"
      ></a-box>

      <a-cylinder
        position="9.487 -2.215 -6.096"
        rotation="0 0 4.198"
        scale="0.678 0.359 0.651"
        color="red"
      >
      </a-cylinder>

      <a-sphere radius="500" side="back" src="#classroom"></a-sphere>

      <a-camera wasd-controls-enabled="false"></a-camera>
    </a-scene>
  </body>
</html>
